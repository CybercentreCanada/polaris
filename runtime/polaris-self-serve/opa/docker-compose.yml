services:
  opa:
    image: openpolicyagent/opa:latest
    container_name: polaris-self-serve-opa
    ports:
      - "8184:8181"
    volumes:
      - ./config:/config:ro
      - ./policies:/policies:ro
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --config-file=/config/config.yaml
      - --watch
      - /policies
